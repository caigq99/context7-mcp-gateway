[workspace]
members = ["crates/gateway"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
bytes = "1"
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
hmac = "0.12"
futures-util = "0.3"
httpdate = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace", "timeout", "request-id"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.29", features = ["v4", "serde"] }
webauthn-rs = { version = "0.6.2", default-features = false, features = ["danger-allow-state-serialisation"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
